version: '3'

vars:
  # --- Go Tool Aliases ---
  AIR: go tool air
  GOOSE: go tool goose
  SQLC: go tool sqlc
  
  # --- Vars ---
  APP_NAME: 'bahago'
  DB_URL: '{{.DATABASE_URL}}'
  MIGRATIONS_DIR: ./internal/database/migrations
  QUERIES_DIR: './internal/database/queries'
  SQLC_DIR: './internal/database/sqlc'

tasks:
  # --- Development & Build (go) ---
  dev:
    desc: Start the live-reload development server
    deps: [css:build]
    cmds:
      - '{{.AIR}} -c .air.toml'

  build:
    desc: Build the production binary
    deps: [css:build, gen, test]
    cmds:
      - 'go build -o bin/{{.APP_NAME}} ./cmd/server/main.go'

  test:
    desc: "Run all project tests. Example: task test -- -v"
    cmds:
      - go test {{.CLI_ARGS}} ./...

  check:
    desc: Compile all packages without producing a binary (fast correctness check)
    cmds:
      - go build ./...

  lint:
    desc: Run go vet to check for potential issues
    cmds:
      - go vet ./...

  tidy:
    desc: Install dependencies and tidy modules
    cmds:
      - go mod tidy
      - go mod verify

  # --- CSS Build ---
  css:build:
    desc: Concatenate CSS source files in web/css/ into web/static/styles.css
    sources:
      - 'web/css/*.css'
    generates:
      - 'web/static/styles.css'
    cmds:
      - 'cat web/css/*.css > web/static/styles.css'

  # --- Code Generation (sqlc) ---
  gen:
    desc: Generate Go code from SQL queries
    sources:
      - '{{.QUERIES_DIR}}/*.sql'
      - '{{.MIGRATIONS_DIR}}/*.sql'
      - 'sqlc.yaml'
    generates:
      - '{{.SQLC_DIR}}/*.go'
    cmds:
      - '{{.SQLC}} generate'

  # --- Database Migrations (Goose) ---
  db:up:
    desc: Run all pending migrations
    cmds:
      - '{{.GOOSE}} -dir {{.MIGRATIONS_DIR}} postgres {{.DB_URL}} up'

  db:down:
    desc: Roll back the most recent migration
    cmds:
      - '{{.GOOSE}} -dir {{.MIGRATIONS_DIR}} postgres {{.DB_URL}} down'

  db:status:
    desc: Check the migration status of the database
    cmds:
      - '{{.GOOSE}} -dir {{.MIGRATIONS_DIR}} postgres {{.DB_URL}} status'

  db:reset:
    desc: Roll back all migrations and re-apply them (local dev only)
    cmds:
      - '{{.GOOSE}} -dir {{.MIGRATIONS_DIR}} postgres {{.DB_URL}} reset'
      - '{{.GOOSE}} -dir {{.MIGRATIONS_DIR}} postgres {{.DB_URL}} up'

  db:create:
    desc: Create a new migration file (e.g., task db:create -- add_users_table)
    cmds:
      - '{{.GOOSE}} -dir {{.MIGRATIONS_DIR}} create {{.CLI_ARGS}} sql'

  # --- Tool Aliases ---
  seed:
    desc: Seed the database with fake users and kingdoms for local development (e.g. task seed -- --count=500)
    cmds:
      - go run ./cmd/seed/main.go {{.CLI_ARGS}}

  air:
    desc: Alias for air
    cmds:
      - '{{.AIR}} {{.CLI_ARGS}}'

  goose:
    desc: Alias for goose
    cmds:
      - '{{.GOOSE}} {{.CLI_ARGS}}'

  sqlc:
    desc: Alias for sqlc
    cmds:
      - '{{.SQLC}} {{.CLI_ARGS}}'
