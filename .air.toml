root = "."
tmp_dir = ".tmp"

[build]
  cmd = "go build -o ./.tmp/main ./cmd/server/main.go"
  entrypoint = "./.tmp/main"
  exclude_dir = [".tmp", "testdata"]
  exclude_file = ["internal/database/queries/*.go"]
  exclude_regex = ["_test.go"]
  include_ext = ["go", "css", "sql"]
  stop_on_error = true

[screen]
  clear_on_rebuild = true
  keep_scroll = true

[color]
main = "magenta"
watcher = "cyan"
build = "red"
runner = "green"

[misc]
# Delete tmp directory on exit
clean_on_exit = false


[proxy]
  enabled = false
  proxy_port = 8090
  app_port = 8080
  app_start_timeout = 5000