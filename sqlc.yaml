version: "2"
sql:
  - engine: "postgresql"
    queries: "./internal/database/queries"
    schema: "./internal/database/migrations"
    gen:
      go:
        package: "db"
        out: "./internal/database/db"
        sql_package: "pgx/v5"
        emit_json_tags: false
        emit_interface: true
        overrides:
          - db_type: "pg_catalog.int8"
            nullable: true
            go_type: "int"
          - db_type: "pg_catalog.int8"
            nullable: false
            go_type: "int"
          - db_type: "pg_catalog.int4"
            nullable: true
            go_type: "int"
          - db_type: "pg_catalog.int4"
            nullable: false
            go_type: "int"
          - db_type: "timestamptz"
            go_type: "time.Time"