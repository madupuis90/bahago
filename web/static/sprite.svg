<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>

    <!--
      Bahago icon sprite — slim pass.

      Every symbol is 24×24, stroke-width 2, round caps/joins, fill none,
      stroke currentColor. Strokes are inset ~1px so they never clip when
      scaled down. Colour is applied via currentColor on the glyph's
      container; flat colour is delivered by a chip behind the glyph
      (see .gem / .crest in the CSS), never baked into these paths.

      Kept set (9): the six resources + idle + sandglass + crown.
      See docs/design/icons.md.
    -->

    <!-- ── Standalone glyphs ─────────────────────────────────────────────── -->

    <!-- Crown — standalone glyph, formerly the identity-mark placeholder.
         Retained as a general "realm" symbol. Three bold spikes (the outer
         two lean outward, away from center), a base band, and a band detail
         line. -->
    <symbol id="crown" viewBox="0 0 24 24">
      <path d="M4 19 L4 13 L1.5 7.5 L8.5 12 L12 5 L15.5 12 L22.5 7.5 L20 13 L20 19 Z"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M5 16.5 L19 16.5"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- Envelope — used by the auth crest on the recovery-sent state. -->
    <symbol id="envelope" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7 H21 V18 H3 Z"/>
        <polyline points="3,7 12,14 21,7"/>
      </g>
    </symbol>

    <!-- Idle — sleeping zzz, three Z's of growing size. -->
    <symbol id="idle" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 4 H8 L3 9 H8"/>
        <path d="M7 9 H13 L7 15 H13"/>
        <path d="M11 15 H19 L11 21 H19"/>
      </g>
    </symbol>

    <!-- Arrows — direction markers for per-tick rate pills (upkeep down /
         production up). Used alongside the sandglass inside cost pills
         (see WithCostKind in internal/ui/costpill.go). Chevron glyphs,
         stroke-width 2, round caps/joins, inset ~2px like the other glyphs. -->
    <symbol id="arrow-down" viewBox="0 0 24 24">
      <path d="M12 5 V15 M6 11 L12 19 L18 11"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="arrow-up" viewBox="0 0 24 24">
      <path d="M12 19 V9 M6 13 L12 5 L18 13"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- Sandglass — tick timer. Body + a small sand pile in the lower bulb. -->
    <symbol id="sandglass" viewBox="0 0 24 24">
      <path d="M4 4 H20 L13 12 L20 20 H4 L11 12 Z"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M10 19 H14 L12 14 Z" fill="currentColor" stroke="none"/>
    </symbol>

    <!-- ── Resource glyphs — canonical artwork, square 24×24. ────────────── -->

    <symbol id="res-wood" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5 L18 15 L6 15 Z"/>
        <line x1="12" y1="15" x2="12" y2="19"/>
      </g>
    </symbol>

    <symbol id="res-stone" viewBox="0 0 24 24">
      <path d="M3 18 L9 9 L12.5 13 L16 7 L21 18 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <symbol id="res-food" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8.5 11 C8.5 11 9.5 21 12 21 C14.5 21 15.5 11 15.5 11 Z"/>
        <path d="M9.8 13.6 L14.2 13.6"/>
        <path d="M10.5 16.2 L13.5 16.2"/>
        <path d="M11.2 18.6 L12.8 18.6"/>
        <path d="M12 11 L8.8 5"/>
        <path d="M12 11 L12 3.8"/>
        <path d="M12 11 L15.2 5"/>
      </g>
    </symbol>

    <symbol id="res-mana" viewBox="0 0 24 24">
      <path d="M12 4 C13.5 7.5 16.5 9.5 16.5 14 C16.5 17.5 14.5 19.5 12 19.5 C9.5 19.5 7.5 17.5 7.5 14 C7.5 9.5 10.5 7.5 12 4 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <symbol id="res-devotion" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3.6"/>
        <g>
          <line x1="12" y1="3.5" x2="12" y2="6"/>
          <line x1="12" y1="18" x2="12" y2="20.5"/>
          <line x1="3.5" y1="12" x2="6" y2="12"/>
          <line x1="18" y1="12" x2="20.5" y2="12"/>
          <line x1="6" y1="6" x2="7.8" y2="7.8"/>
          <line x1="16.2" y1="16.2" x2="18" y2="18"/>
          <line x1="6" y1="18" x2="7.8" y2="16.2"/>
          <line x1="16.2" y1="7.8" x2="18" y2="6"/>
        </g>
      </g>
    </symbol>

    <symbol id="res-knowledge" viewBox="0 0 24 24">
      <path d="M12 4 L14 9.6 L20 9.9 L15.2 13.6 L17 19.4 L12 15.8 L7 19.4 L8.8 13.6 L4 9.9 L10 9.6 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    </symbol>

  </defs>
</svg>
